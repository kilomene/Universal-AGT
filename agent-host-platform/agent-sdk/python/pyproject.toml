[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uaht-sdk"
version = "1.0.0"
description = "Python SDK for the Universal Agent-to-Persistent-Host Deployment System control plane."
requires-python = ">=3.10"
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/kilomene/Universal-AGT"

[tool.hatch.build.targets.wheel]
packages = ["src/uaht_sdk"]
