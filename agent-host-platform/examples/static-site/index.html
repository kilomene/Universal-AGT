<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Universal AGT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .card {
      background: #161b22; border: 1px solid #262d36; border-radius: 12px;
      padding: 48px 56px; max-width: 560px;
    }
    .diamond { color: #2f81f7; font-size: 28px; }
    h1 { font-size: 28px; margin: 16px 0 8px; }
    p { color: #8b949e; font-size: 15px; line-height: 1.6; }
    code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: #0d1117; border: 1px solid #262d36; border-radius: 6px;
      padding: 2px 8px; font-size: 13px; color: #58a6ff;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="diamond" aria-hidden="true">&#9670;</div>
    <h1>Hello from Universal AGT</h1>
    <p>This static page was deployed by an agent through the
      Universal Agent-to-Persistent-Host Deployment System.
      It is served by <code>nginx</code> inside a container on a
      persistent host &mdash; no build step, no framework, no server code.</p>
  </main>
</body>
</html>
